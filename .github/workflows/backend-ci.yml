name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,mcp]'
      - name: Unit and HTTP tests
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests
      - name: HTTP simulator smoke test
        run: bash ../../scripts/demo_backend.sh
