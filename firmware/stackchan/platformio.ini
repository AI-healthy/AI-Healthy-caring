; Stack-chan K151 firmware skeleton (LAN-01/LAN-02)
; NOT hardware-verified. Build with PlatformIO, then follow docs/STACKCHAN_DEVICE_PROFILE.md.

[env:stackchan-k151]
; StackChan-BSP requires Arduino-ESP32 core 3.x (ESP-IDF 5.x).
; Official PlatformIO espressif32 still ships core 2.x, so use pioarduino.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default_16MB.csv

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/m5stack/StackChan-BSP.git#main

; LAN-01 hardware bring-up: serial PASS/FAIL report, no Wi-Fi needed.
[env:stackchan-selftest]
extends = env:stackchan-k151
build_flags =
    ${env:stackchan-k151.build_flags}
    -DHC_SELFTEST=1
