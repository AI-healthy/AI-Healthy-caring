name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,mcp]'
      - name: Unit and HTTP tests
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests
      - name: HTTP simulator smoke test
        run: bash ../../scripts/demo_backend.sh
      - name: Synthetic harness benchmark
        run: |
          for seed in 42 43 44; do
            python -m shiyi_api.benchmark --seed "$seed" --per-cohort 12 --assert-gates --output "../../benchmark-results/seed-$seed"
          done
      - name: Upload synthetic benchmark
        uses: actions/upload-artifact@v4
        with:
          name: shiyi-synthetic-benchmark
          path: benchmark-results/
